# CI for the Ruby SDK (alplus-ruby), destined for Alplus-Tech/sdk-ruby.
# Lives inside sdks/ruby so it becomes the repo-root workflow after the split
# (issue #26). GitHub ignores it in the monorepo (only repo-root workflows run).
#
# The contract test consumes the product's versioned golden fixtures as an
# explicit input: this job checks out sdks/contract from Alplus-Tech/alplus at a
# pinned tag and sets ALPLUS_CONTRACT_DIR. No local fallback.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT_REF: contract-v1.0.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned contract
        uses: actions/checkout@v4
        with:
          repository: Alplus-Tech/alplus
          ref: ${{ env.CONTRACT_REF }}
          token: ${{ secrets.CONTRACT_REPO_TOKEN }}
          sparse-checkout: sdks/contract
          path: .contract-src

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RSpec (unit and contract)
        env:
          ALPLUS_CONTRACT_DIR: ${{ github.workspace }}/.contract-src/sdks/contract
        run: bundle exec rspec

      - name: Build the gem
        run: gem build alplus-ruby.gemspec
