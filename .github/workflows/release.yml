# Release for postdeploy to RubyGems, destined for Alplus-Tech/sdk-ruby.
# Manual or tag-driven only; a product change can never publish an SDK.
#
# Publishing uses RubyGems trusted publishing (OIDC) via rubygems/release-gem --
# the registry's preferred mechanism, no long-lived GEM_HOST_API_KEY. Configure
# postdeploy's trusted publisher on RubyGems to accept Alplus-Tech/sdk-ruby +
# this workflow.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # RubyGems trusted publishing (OIDC)

env:
  CONTRACT_COMMIT: ${{ vars.CONTRACT_V2_COMMIT }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable contract commit
        shell: bash
        run: |
          if [[ ! "$CONTRACT_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::CONTRACT_V2_COMMIT must be a full 40-hex product commit SHA"
            exit 1
          fi


      - name: Check out the pinned contract
        uses: actions/checkout@v4
        with:
          repository: Alplus-Tech/alplus
          ref: ${{ env.CONTRACT_COMMIT }}
          token: ${{ secrets.CONTRACT_REPO_TOKEN }}
          sparse-checkout: sdks/contract
          path: .contract-src

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify before publish
        env:
          ALPLUS_CONTRACT_DIR: ${{ github.workspace }}/.contract-src/sdks/contract
        run: bundle exec rspec

      # Builds and pushes to RubyGems using trusted publishing (OIDC).
      - uses: rubygems/release-gem@v1
